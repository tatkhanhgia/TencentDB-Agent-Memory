<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap theme chống FOUC (SPEC-M1 §3.1).
         Phải là classic script đồng bộ, đặt TRƯỚC mọi stylesheet/module: nó đặt
         data-ui-skin + theme-mode lên <html> trước khi CSS và React kịp chạy. -->
    <script>
      (() => {
        const root = document.documentElement;
        let preference = 'system';
        try {
          const stored = localStorage.getItem('tdai-panel.theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored;
        } catch {}
        const mode =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference;
        root.setAttribute('data-ui-skin', 'v2');
        root.setAttribute('theme-mode', mode);
      })();
    </script>
    <title>Memory Hub</title>
    <link rel="icon" type="image/png" href="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
